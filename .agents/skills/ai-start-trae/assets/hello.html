<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Привет</title>
  <style>
    :root { --bg: #f4efe6; --ink: #1c1915; --muted: #5c564c; --ember: #c45c2c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1a1714; --ink: #f3ece3; --muted: #b5aa9c; --ember: #e07a45; }
    }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
      background: radial-gradient(1200px 600px at 10% -10%, rgba(196, 92, 44, 0.12), transparent 55%), var(--bg);
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    main { max-width: 28rem; text-align: center; }
    h1 { font-size: clamp(2rem, 6vw, 2.6rem); letter-spacing: -0.03em; margin: 0 0 0.75rem; }
    p { font-size: 1.15rem; color: var(--muted); margin: 0; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>Привет. Это уже в интернете.</h1>
    <p>Страница собрана агентом и лежит на Vercel. Дальше здесь появится список на шашлык.</p>
  </main>
</body>
</html>
